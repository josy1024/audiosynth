# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        working-directory: audiosynthSOL/audiosynth
        run: dotnet restore

      - name: Build
        working-directory: audiosynthSOL/audiosynth
        run: dotnet build --no-restore

      - name: Test
        working-directory: audiosynthSOL/audiosynth
        run: dotnet test --no-build --verbosity normal

      - name: Publish
        run: dotnet publish audiosynthSOL/audiosynth/audiosynth.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true --output ./publish

      - name: Create ZIP for distribution
        run: Compress-Archive -Path ./publish/* -DestinationPath ./audiosynth-win-x64.zip

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: audiosynth-win-x64
          path: audiosynth-win-x64.zip
