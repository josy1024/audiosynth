name: Release Build

on:
  push:
    tags:
      - "v*" # Triggers on tags like v1.0.0, v2.1.3, etc.

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish audiosynthSOL/audiosynth/audiosynth.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true --output ./publish

      - name: Create ZIP for distribution
        run: |
          Compress-Archive -Path ./publish/* -DestinationPath audiosynth-win-x64.zip

      - name: Create GitHub Release and upload ZIP
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: audiosynth-win-x64.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
